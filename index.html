<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7445ed">
  <meta name="description" content="Шар-Предсказамус — магический шар с мемными предсказаниями. Задай вопрос и узнай, что думает вселенная.">
  <title>Шар-Предсказамус — судьба с чувством юмора</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="intro">
      <span class="badge">✦ ОРАКУЛ НА МИНИМАЛКАХ ✦</span>
      <h1>Шар-<span>Предсказамус</span></h1>
      <p>Задай вопрос, на который можно ответить да или нет.<br class="desktop-break"> За точность отвечает Меркурий. Он сейчас занят.</p>
    </header>

    <section class="oracle" aria-label="Магический шар предсказаний">
      <div class="character-stage" aria-hidden="true">
        <span class="spark spark-one">✦</span><span class="spark spark-two">✧</span>
        <span class="orbit-note">судьба онлайн</span>
        <div class="ball" id="ball" data-mood="idle">
          <svg viewBox="0 0 320 340" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="orb" cx="32%" cy="25%" r="80%"><stop offset="0" stop-color="#c8b0ff"/><stop offset=".5" stop-color="#9560f4"/><stop offset="1" stop-color="#6131c5"/></radialGradient>
              <linearGradient id="base" x2="0" y2="1"><stop stop-color="#ffc86b"/><stop offset="1" stop-color="#f39c46"/></linearGradient>
            </defs>
            <ellipse class="ground-shadow" cx="160" cy="322" rx="101" ry="10" fill="#312344" opacity=".15"/>
            <path d="M94 273 L226 273 L239 309 Q160 332 81 309 Z" fill="url(#base)" stroke="#30213e" stroke-width="6" stroke-linejoin="round"/>
            <path d="M99 292 Q160 305 221 292" fill="none" stroke="#30213e" stroke-width="5" stroke-linecap="round"/>
            <g class="orb-body">
              <circle cx="160" cy="148" r="122" fill="url(#orb)" stroke="#30213e" stroke-width="6"/>
              <path d="M69 107 Q83 63 124 51" fill="none" stroke="#eee0ff" stroke-width="13" stroke-linecap="round" opacity=".8"/>
              <circle cx="63" cy="130" r="6" fill="#eee0ff" opacity=".8"/>
              <path class="brow left-brow" d="M99 114 Q115 105 132 112"/><path class="brow right-brow" d="M188 112 Q205 105 222 114"/>
              <g class="eyes">
                <ellipse cx="117" cy="147" rx="23" ry="29" fill="#fffdf5" stroke="#30213e" stroke-width="5"/>
                <ellipse cx="203" cy="147" rx="23" ry="29" fill="#fffdf5" stroke="#30213e" stroke-width="5"/>
                <g class="pupils"><ellipse cx="122" cy="150" rx="9" ry="13" fill="#30213e"/><ellipse cx="198" cy="150" rx="9" ry="13" fill="#30213e"/><circle cx="125" cy="145" r="3" fill="white"/><circle cx="201" cy="145" r="3" fill="white"/></g>
              </g>
              <ellipse cx="88" cy="183" rx="16" ry="8" fill="#f991ce" opacity=".75"/><ellipse cx="232" cy="183" rx="16" ry="8" fill="#f991ce" opacity=".75"/>
              <path class="mouth mouth-idle" d="M140 192 Q160 211 180 192"/>
              <path class="mouth mouth-yes" d="M133 189 Q160 232 187 189 Z" fill="#30213e"/>
              <path class="mouth mouth-no" d="M141 206 Q160 191 179 206"/>
              <path class="mouth mouth-maybe" d="M151 202 L173 199"/>
              <path d="M251 70 L255 81 L267 85 L255 89 L251 101 L247 89 L235 85 L247 81 Z" fill="#ffe794" stroke="#30213e" stroke-width="3"/>
            </g>
          </svg>
        </div>
        <span class="spark spark-three">✦</span>
      </div>

      <div class="console">
        <form id="question-form">
          <label for="question">Что волнует твою вселенную?</label>
          <div class="input-row">
            <input id="question" name="question" type="text" placeholder="Задай свой вопрос…" maxlength="300" autocomplete="off" required>
            <button class="shake-button" id="shake-button" type="submit" disabled>Потрясти <span aria-hidden="true">🔮</span></button>
          </div>
        </form>
        <div class="result-area" id="result-area" aria-busy="false">
          <div id="announcement" role="status" aria-live="polite" aria-atomic="true">
            <p class="waiting" id="waiting">Твой вопрос + моя магия = почти наука</p>
            <div class="result" id="result" hidden>
              <span class="result-label" id="result-label"></span>
              <p class="asked-question" id="asked-question"></p>
              <p class="answer" id="answer"></p>
            </div>
          </div>
          <div class="result-actions" id="result-actions" hidden>
            <button class="again-button" id="again-button" type="button">Спросить ещё <span aria-hidden="true">↗</span></button>
            <button class="copy-button" id="copy-button" type="button">Скопировать ответ</button>
          </div>
        </div>
      </div>
    </section>
    <footer>Сделано из звёздной пыли и сомнительных выводов.<span>Для улыбки, а не важных решений ✨</span></footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
